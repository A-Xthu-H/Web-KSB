# Konfigurasi Nginx untuk frontend SPA (React + Vite)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index.html;

    # Kompresi aset untuk performa (bab 6 PRD: muat < 3 detik).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache aset statis ber-hash dari Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend dan API berada pada origin yang sama di Docker. Ini menghindari
    # URL localhost yang keliru ketika website dibuka dari perangkat lain.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # SPA fallback: semua rute diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
