# Konfigurasi Nginx untuk VPS (frontend statis + proxy API ke backend).
# Salin ke /etc/nginx/sites-available/web-ksb lalu symlink ke sites-enabled.
# Ganti "domain-anda.com" dengan domain asli.

server {
    listen 80;
    server_name domain-anda.com www.domain-anda.com;

    # ---- Frontend (hasil build Vite) ----
    root /var/www/web-ksb/frontend/dist;
    index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Proxy API ke backend Express ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Proxy file upload lokal (fallback Cloudinary) ----
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
